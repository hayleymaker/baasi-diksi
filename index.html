  min-height: 70vh;
}
.start-gate .word-preview { justify-content: center; }
.start-btn {

  white-space: nowrap;

.word {

  padding: 0.15em 0.1em 0.2em;

.word.sm { font-size: 2.1rem; }

.jp {

}
.hint { font-family: var(--font-kai); font-size: 1.15rem; margin: 14px 0; color: var(--ink); }
.caption { color: var(--muted); font-size: 1.05rem; margin: 8px 0 0; text-align: center; font-family: var(--font-kai); }
.meta { color: var(--muted); margin: 4px 0 14px; font-size: 1.05rem; font-family: var(--font-kai); }
.top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 8px;
}
.top .titles { flex: 1 1 auto; min-width: 0; }
.top-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;

}

  gap: 16px;
  flex-wrap: wrap;
  margin: 0 0 6px;
}

button {
  font-family: var(--font-kai);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible { outline: 3px solid var(--brown); outline-offset: 2px; }
button.btn {
  font-size: 1.15rem;
  padding: 12px 22px;
  min-height: 52px;
  border-radius: 12px;
  border: 2px solid var(--brown);
  background: #fff;
  color: var(--brown);
}
button.btn.primary {
  background: var(--sky);
  border-color: var(--sky-dark);
  color: #163445;
}
button.btn.fs { margin-left: auto; }
button.speak {
  flex: 0 0 auto;
  font-size: 1.2rem;
  min-width: 96px;
  min-height: 56px;
  padding: 10px 18px;
  border-radius: 14px;
  border: 2px solid var(--sky-dark);
  background: var(--sky);
  color: #163445;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
button.speak .speak-icon { width: 1.45em; height: 1.45em; flex-shrink: 0; display: block; }
button.speak.opt .speak-icon { width: 1.7em; height: 1.7em; }
button.speak.playing { background: var(--pink); border-color: var(--pink-dark); color: #5C2A36; }
button.speak.opt {
  width: 100%;
  margin-bottom: 8px;
  min-height: 52px;
  font-size: 1.15rem;
  background: #EAF5FB;
}
button.speak.inline { margin-top: 12px; }
button.choice {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 120px;
  padding: 16px 14px;
  border-radius: 18px;
  border: 3px solid var(--brown);
  background: var(--card);
  color: var(--ink);
  text-align: center;
}
button.choice:disabled { cursor: default; }
button.choice.correct { border-color: var(--ok); background: var(--ok-bg); }
button.choice.wrong { border-color: var(--bad); background: var(--bad-bg); opacity: 0.55; }
button.choice.selected, .drag.selected, .drop.selected {
  box-shadow: 0 0 0 4px var(--sky);
  border-color: var(--sky-dark);
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 12px; }
.grid-modes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-top: 12px;
}
.options {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 16px;
}
.opt-wrap { flex: 1 1 220px; min-width: 180px; }
.photo {
  width: 100%;
  max-height: 36vh;
  object-fit: contain;
  background: transparent;
  border-radius: 16px;
  display: block;
  margin: 0 auto;
}
.photo.cover {
  height: 160px;
  max-height: none;
  object-fit: contain;
  background: #fff;
  padding: 6px;
}
.photo.prompt { max-height: 32vh; }
.pill {
  display: inline-block;
  font-size: 1rem;
  padding: 4px 12px;
  border-radius: 999px;
  margin-bottom: 2px;
  font-family: var(--font-kai);
}
.pill.ok { background: var(--ok); color: #fff; }
.pill.bad { background: var(--bad); color: #fff; }
.badge {
  display: inline-block;
  background: var(--sky);
  color: #163445;
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 1.05rem;
  margin-bottom: 8px;
  font-family: var(--font-kai);
}
.callout {
  margin: 16px 0;
  padding: 18px 20px;
  border-radius: 16px;
  border: 2px solid var(--line);
  background: #fff;
}
.callout.success { border-color: var(--ok); background: var(--ok-bg); }
.callout.info { border-color: var(--sky); background: #EAF5FB; }
.callout .lead { font-family: var(--font-kai); font-size: 1.45rem; margin-bottom: 8px; color: var(--brown); }
.score-box {
  margin: 20px 0;
  padding: 28px;
  border-radius: 18px;
  border: 2px solid var(--ok);
  background: var(--ok-bg);
  text-align: center;
  font-family: var(--font-kai);
}
.score-box .n { font-size: 3rem; line-height: 1.2; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
.prompt-card {
  background: #fff;
  border: 3px solid var(--brown);
  border-radius: 18px;
  padding: 16px;
  text-align: center;
  margin: 8px auto 12px;
  max-width: 520px;
}
.board {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-top: 8px;
  align-items: start;
}
.col-title {
  font-family: var(--font-kai);
  font-size: 1.15rem;
  color: var(--muted);
  margin: 0 0 8px;
  text-align: center;
}
.stack { display: flex; flex-direction: column; gap: 14px; }
.drop, .drag {
  border: 3px dashed var(--brown);
  border-radius: 16px;
  background: #fff;
  min-height: 120px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  touch-action: none;
  position: relative;
}
.drag {
  border-style: solid;
  cursor: grab;
  min-height: 96px;
}
.drag.placed, .drop.filled {
  border-style: solid;
  border-color: var(--ok);
  background: var(--ok-bg);
  cursor: default;
}
.drag.dragging {
  opacity: 0.95;
  box-shadow: 0 8px 24px rgba(44, 28, 20, 0.25);
  cursor: grabbing;
}
.drop.flash-bad { border-color: var(--bad); background: var(--bad-bg); }
.drop img, .drag img { width: 100%; max-height: 108px; object-fit: contain; pointer-events: none; }
.mem-grid {
  display: grid;
  gap: 14px;
  margin-top: 12px;
}
.mem-grid.n4 { grid-template-columns: 1fr 1fr; max-width: 640px; margin-left: auto; margin-right: auto; }
.mem-grid.n6 { grid-template-columns: 1fr 1fr 1fr; }
.mem-card {
  min-height: 150px;
  border-radius: 16px;
  border: 3px solid var(--brown);
  background: var(--sky);
  color: #163445;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  font-family: var(--font-kai);
  font-size: 1.6rem;
  position: relative;
}
.mem-card .back-label { font-size: 1.8rem; }
.mem-card.open, .mem-card.matched {
  background: #fff;
  color: var(--ink);
}
.mem-card.matched { border-color: var(--ok); background: var(--ok-bg); }
.mem-card.mismatch { border-color: var(--bad); }
.mem-card img { width: 100%; max-height: 130px; object-fit: contain; pointer-events: none; }
#bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  background: #fff;
  border-top: 1px solid var(--line);
  padding: 12px 28px;
  display: flex;
  gap: 12px;
  align-items: center;
  z-index: 10;
}
#bar[hidden] { display: none; }
.level-btn .word-preview { display: flex; gap: 10px; justify-content: center; width: 100%; }
.level-btn { min-height: 260px; justify-content: flex-end; gap: 6px; padding: 16px 16px 20px; }
.level-btn .mode-title { font-size: 2.4rem; }
.level-btn .mode-sub { font-size: 1.2rem; color: var(--muted); }

  max-width: 46%;

  padding: 0;
}
.mode-btn { min-height: 200px; padding-top: 18px; }
.mode-btn .photo { max-width: 70%; height: 90px; max-height: 90px; }
.mode-btn .mode-title, .level-btn .mode-title { font-family: var(--font-kai); color: var(--brown); }
.mode-btn .mode-title { font-size: 1.7rem; }
.mode-btn .mode-sub, .level-btn .mode-sub { font-family: var(--font-kai); color: var(--muted); }
.mode-btn .mode-sub { font-size: 1.05rem; }

  #app { padding: 12px 14px 150px; }

  .word { font-size: 2.1rem; }

  .photo.prompt, .photo { max-height: 28vh; }
  button.speak, button.speak.opt { min-height: 48px; }
}

function refreshVoice() {
  if (!window.speechSynthesis) return;

  const score = (v) => {

    if (/(^|[\s-])zh/.test(s)) return 1;
    return 0;
  };
  const ranked = voices.slice().sort((a, b) => score(b) - score(a));
  currentVoice = ranked.length && score(ranked[0]) > 0 ? ranked[0] : null;
}

function stopSpeak() {
  if (window.speechSynthesis) speechSynthesis.cancel();
  document.querySelectorAll("button.speak.playing").forEach((b) => b.classList.remove("playing"));
}

function speakTexts(texts, btn) {
  if (!speakEnabled || !window.speechSynthesis || !texts || !texts.length) return;
  stopSpeak();
  if (btn) btn.classList.add("playing");
  refreshVoice();
  texts.forEach((text, i) => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (currentVoice && currentVoice.lang) || "zh-HK";
    if (currentVoice) u.voice = currentVoice;
    u.rate = 0.85;
    u.pitch = 1;
    if (i === texts.length - 1) {
      const clear = () => { if (btn) btn.classList.remove("playing"); };
      u.onend = clear;
      u.onerror = clear;
    }
    speechSynthesis.speak(u);
  });
}

function speakLabel(text) {
  return text + '<svg class="speak-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path fill="currentColor" d="M4.8 11.2h5.6L17 5.4v21.2l-6.6-5.8H4.8a2 2 0 0 1-2-2v-5.6a2 2 0 0 1 2-2z"/><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M21 12.1a5.4 5.4 0 0 1 0 7.8"/><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M25.4 8.8a10 10 0 0 1 0 14.4"/></svg>';
}

function shuffle(arr) {
  const a = arr.slice();
  if (QA_ON) return a;
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function groupKeys() {
  return state.group === "senior" ? ["bus", "taxi", "car"] : ["bus", "taxi"];
}

function W(id) { return WORDS[id]; }

function canto(word) {
  return '<span class="canto">' + word + "</span>";
}

function imgTag(key, alt, cls) {
  return '<img class="' + (cls || "photo") + '" src="' + PHOTOS[key] + '" alt="' + (alt || "") + '" draggable="false">';
}

function wordBlock(id, size) {
  const w = W(id);
  return '<div class="word' + (size ? " " + size : "") + '">' + w.word + "</div>";
}

function jpBlock(id) {
  return '<div class="jp">' + W(id).jp + "</div>";
}

function el(html) {
  const d = document.createElement("div");
  d.innerHTML = html.trim();
  return d.firstElementChild;
}

function modeTitle(id) {
  const m = MODES.find((x) => x.id === id);
  return m ? m.title : "";
}

function groupLabel() {
  return state.group === "senior" ? "高組" : "初組";
}

function toggleFs() {
  const root = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    const req = root.requestFullscreen || root.webkitRequestFullscreen;
    if (req) req.call(root).catch(() => {});
  } else {
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (ex) ex.call(document).catch(() => {});
  }
}

function goHome() {
  stopSpeak();
  state.screen = "home";
  state.group = null;
  state.mode = null;
  state.items = [];
  state.index = 0;
  state.speakCue = "home";
  render();
}

function goMenu() {
  stopSpeak();
  state.screen = "menu";
  state.mode = null;
  state.items = [];
  state.index = 0;
  state.speakCue = "menu";
  render();
}

function startMode(mode) {
  stopSpeak();
  state.mode = mode;
  state.items = buildItems(state.group, mode);
  state.index = 0;
  state.locked = false;
  state.wrongTried = [];
  state.missedFirst = false;
  state.firstTryCorrect = 0;
  state.finishedCount = 0;
  state.placed = {};
  state.selectedDrag = null;
  state.flipped = [];
  state.matched = [];
  state.lockFlip = false;
  state.flashDrop = null;
  state.speakCue = "question";
  state.screen = "play";
  render();
}

function goNext() {
  stopSpeak();
  const next = state.index + 1;
  if (next >= state.items.length) {
    state.finishedCount = state.firstTryCorrect;
    state.screen = "end";
    state.speakCue = "end";
    render();
    return;
  }
  state.index = next;
  state.locked = false;
  state.wrongTried = [];
  state.missedFirst = false;
  state.placed = {};
  state.selectedDrag = null;
  state.flipped = [];
  state.matched = [];
  state.lockFlip = false;
  state.flashDrop = null;
  state.speakCue = "question";
  render();
}

function markFirst(ok) {
  if (!ok) state.missedFirst = true;
  else if (!state.missedFirst) state.firstTryCorrect += 1;
}

function buildItems(group, mode) {
  const junior = group !== "senior";
  const keys = junior ? ["bus", "taxi"] : ["bus", "taxi", "car"];
  if (mode === "tap") return buildTap(junior, keys);
  if (mode === "drag") return buildDrag(junior, keys);
  if (mode === "shadow") return buildShadow(junior, keys);
  if (mode === "memory") return buildMemory(junior, keys);
  if (mode === "jyutping") return buildJyutping(junior, keys);
  return [];
}

function buildTap(junior, keys) {
  const items = [];
  keys.forEach((k) => {
    items.push({
      kind: "tap",
      type: "wordToPic",
      answer: k,
      question: "邊幅圖係「" + W(k).word + "」？",
      questionSpeak: "邊幅圖係" + W(k).speak + "？",
      promptWord: k,
      options: shuffle(keys).map((id) => ({ id, show: "pic" }))
    });
  });
  keys.forEach((k) => {
    const wordOpts = junior
      ? keys.slice()
      : (k === "car" ? ["car", "bus", "decoy"] : [k, "decoy", k === "bus" ? "taxi" : "bus"]);
    items.push({
      kind: "tap",
      type: "picToWord",
      answer: k,
      question: "呢架係咩？請揀正確嘅詞語。",
      questionSpeak: "呢架係咩？請揀正確嘅詞語。",
      promptPic: k,
      options: shuffle(wordOpts).map((id) => ({ id, show: "word" }))
    });
  });
  if (junior) return shuffle(items).slice(0, 5);
  if (items.length > 7) return shuffle(items).slice(0, 7);
  return shuffle(items);
}

function buildDrag(junior, keys) {
  const boards = [];
  boards.push({
    kind: "drag",
    type: "wordToPic",
    question: "請將詞語拖去啱嘅圖度。",
    hint: "可以先撳詞語，再撳圖。",
    questionSpeak: "請將詞語拖去啱嘅圖度。可以先撳詞語，再撳圖。",
    sources: junior ? shuffle(keys) : shuffle(keys.concat(["decoy"])),
    targets: shuffle(keys),
    sourceShow: "word",
    targetShow: "pic",
    hasDecoy: !junior
  });
  boards.push({
    kind: "drag",
    type: "picToWord",
    question: "請將圖拖去啱嘅詞語度。",
    hint: "可以先撳圖，再撳詞語。",
    questionSpeak: "請將圖拖去啱嘅詞語度。可以先撳圖，再撳詞語。",
    sources: shuffle(keys),
    targets: junior ? shuffle(keys) : shuffle(keys.concat(["decoy"])),
    sourceShow: "pic",
    targetShow: "word",
    hasDecoy: !junior
  });
  return boards;
}

function buildShadow(junior, keys) {
  const boards = [];
  boards.push({
    kind: "drag",
    type: "picToSil",
    question: "請將相片配去啱嘅影子。",
    hint: "可以先撳相片，再撳影子。",
    questionSpeak: "請將相片配去啱嘅影子。可以先撳相片，再撳影子。",
    sources: shuffle(keys),
    targets: shuffle(keys),
    sourceShow: "pic",
    targetShow: "sil",
    hasDecoy: false
  });
  boards.push({
    kind: "drag",
    type: "silToPic",
    question: "請將影子配去啱嘅相片。",
    hint: "可以先撳影子，再撳相片。",
    questionSpeak: "請將影子配去啱嘅相片。可以先撳影子，再撳相片。",
    sources: shuffle(keys),
    targets: shuffle(keys),
    sourceShow: "sil",
    targetShow: "pic",
    hasDecoy: false
  });

function buildMemory(junior, keys) {
  const rounds = [];
  const pairCards = (pairs) => {
    const cards = [];
    pairs.forEach((p, i) => {
      cards.push({ cardId: p.aId, pairId: p.pairId, show: p.aShow, word: p.word });
      cards.push({ cardId: p.bId, pairId: p.pairId, show: p.bShow, word: p.word });
    });
    return shuffle(cards);
  };
  rounds.push({
    kind: "memory",
    question: "請搵相同嘅一對。請翻開兩張卡。",
    questionSpeak: "請搵相同嘅一對。請翻開兩張卡。",
    needed: keys.length,
    cards: pairCards(keys.map((k) => ({
      pairId: k + "-pw",
      word: k,
      aId: k + "-pic",
      bId: k + "-word",
      aShow: "pic",
      bShow: "word"
    })))
  });
  if (junior) {
    rounds.push({
      kind: "memory",
      question: "請搵相同嘅一對。請翻開兩張卡。",
      questionSpeak: "請搵相同嘅一對。請翻開兩張卡。",
      needed: keys.length,
      cards: pairCards(keys.map((k) => ({
        pairId: k + "-pw2",
        word: k,
        aId: k + "-pic2",
        bId: k + "-word2",
        aShow: "pic",
        bShow: "word"
      })))
    });
  } else {
    rounds.push({
      kind: "memory",
      question: "請搵相同嘅一對。請翻開兩張卡。",
      questionSpeak: "請搵相同嘅一對。請翻開兩張卡。",
      needed: keys.length,
      cards: pairCards(keys.map((k) => ({
        pairId: k + "-wj",
        word: k,
        aId: k + "-word3",
        bId: k + "-jp",
        aShow: "word",
        bShow: "jp"
      })))
    });
  }
  return rounds;
}

function buildJyutping(junior, keys) {
  const items = [];
  const allJp = junior ? ["bus", "taxi"] : ["bus", "taxi", "car", "decoy"];
  keys.forEach((k) => {
    let opts;
    if (junior) opts = shuffle(["bus", "taxi"]);
    else if (k === "bus") opts = shuffle(["bus", "decoy", "taxi"]);
    else if (k === "taxi") opts = shuffle(["taxi", "bus", "car"]);
    else opts = shuffle(["car", "taxi", "decoy"]);
    items.push({
      kind: "tap",
      type: "picToJp",
      answer: k,
      question: "呢架車點讀？",
      questionSpeak: W(k).speak + "，粵拼係邊個？",
      promptPic: k,
      options: opts.map((id) => ({ id, show: "jp" }))
    });
    items.push({
      kind: "tap",
      type: "wordToJp",
      answer: k,
      question: "呢個詞語點讀？",
      questionSpeak: W(k).speak + "，粵拼係邊個？",
      promptWord: k,
      options: opts.map((id) => ({ id, show: "jp" }))
    });
  });
  if (junior) return shuffle(items).slice(0, 5);
  return shuffle(items).slice(0, 6);
}

function optionContent(opt) {
  const w = W(opt.id);
  if (opt.show === "pic") return imgTag(w.photo, w.photoAlt, "photo cover");
  if (opt.show === "sil") return imgTag(w.sil, w.word + "影子", "photo cover");
  if (opt.show === "jp") return jpBlock(opt.id);
  return wordBlock(opt.id);
}

function optionSpeak(opt) {
  const w = W(opt.id);
  if (opt.show === "jp") return w.jpSpeak;
  return w.speak;
}

function speakQuestion(item, btn) {
  const parts = [item.questionSpeak || item.question];
  if (item.hint) parts.push(item.hint);
  if (item.options) {
    item.options.forEach((o, i) => {
      parts.push((ORDINALS[i] || "") + "，" + optionSpeak(o));
    });
  } else if (item.sources && item.targets) {
    item.sources.forEach((id, i) => {
      const show = item.sourceShow === "jp" ? W(id).jpSpeak : W(id).speak;
      parts.push((ORDINALS[i] || "") + "，" + show);
    });
  } else if (item.cards) {
    parts.push("一共有" + item.cards.length + "張卡。");
  }
  speakTexts(parts, btn);
}

function feedbackSentences(item) {
  if (item.answer) return [W(item.answer)];
  const keys = (item.targets || []).filter((id) => id !== "decoy");
  const unique = [];
  keys.forEach((k) => { if (!unique.includes(k)) unique.push(k); });
  if (!unique.length && item.cards) {
    item.cards.forEach((c) => { if (c.word && !unique.includes(c.word)) unique.push(c.word); });
  }
  return unique.map(W);
}

function speakFeedback(item, btn) {
  const parts = ["啱喇"];
  feedbackSentences(item).forEach((w) => { if (w.sentenceSpeak) parts.push(w.sentenceSpeak); });
  if (item.hasDecoy) parts.push("留意，巴土唔係正確嘅詞語。");
  speakTexts(parts, btn);
}

function speakRetry() {
  speakTexts(["再試一次。唔緊要，再揀一次。"]);
}

function bindSpeakButtons(item) {
  const qBtn = document.getElementById("speak-q");
  if (qBtn) qBtn.onclick = () => speakQuestion(item, qBtn);
  document.querySelectorAll("button.speak[data-speak-word]").forEach((b) => {
    b.onclick = (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      speakTexts([b.getAttribute("data-speak-word")], b);
    };
  });
  const sBtn = document.getElementById("speak-sentence");
  if (sBtn) sBtn.onclick = () => speakFeedback(item, sBtn);
}

function playCue(item) {
  const cue = state.speakCue;
  state.speakCue = null;
  if (cue === "home") speakTexts(["請揀初組定高組。"], document.getElementById("speak-q"));
  else if (cue === "menu") speakTexts(["請揀想玩嘅遊戲。"], document.getElementById("speak-q"));
  else if (cue === "end") speakTexts(["做得好！"], document.getElementById("speak-q"));
  else if (cue === "question" && item) speakQuestion(item, document.getElementById("speak-q"));
  else if (cue === "correct" && item) speakFeedback(item, document.getElementById("speak-sentence") || document.getElementById("speak-q"));
  else if (cue === "retry") speakRetry();
}

function header(showBack, backFn, titleExtra) {
  const back = showBack
    ? '<button type="button" class="btn" id="btn-back">返回</button>'
    : "";
  return '<div class="top">' +
    back +
    '<div class="titles"><h1>' + TITLE + "</h1>" +
    (titleExtra ? '<p class="meta">' + titleExtra + "</p>" : "") +
    "</div>" +
    '<div class="top-actions">' +
    '<button type="button" class="btn fs" id="btn-fs">全螢幕</button>' +
    "</div></div>";
}

function bindChrome(backFn) {
  const back = document.getElementById("btn-back");
  if (back && backFn) back.onclick = backFn;
  const fs = document.getElementById("btn-fs");
  if (fs) fs.onclick = toggleFs;
  const fsBar = document.getElementById("bar-fs");
  if (fsBar) fsBar.onclick = toggleFs;
}

function successCallout(item) {
  const sentences = feedbackSentences(item);
  const lines = sentences.map((w) => '<div class="sentence">' + w.sentence + "</div>").join("");
  const decoy = item.hasDecoy
    ? '<p class="hint">留意：「' + canto("巴土") + "」唔係正確嘅詞語。</p>"
    : "";
  return '<div class="callout success"><div class="lead">啱喇！</div>' +
    lines + decoy +
    '<div class="actions" style="justify-content:center">' +
    '<button type="button" class="speak inline" id="speak-sentence" aria-label="讀出句子">' +
    speakLabel("聽句子") + "</button></div></div>";
}

function retryCallout() {
  return '<div class="callout info"><div class="lead">再試一次</div>唔緊要，再揀一次。</div>';
}

function stemHtml(item) {
  if (item.type === "wordToPic" && item.promptWord) {
    return "邊幅圖係「" + canto(W(item.promptWord).word) + "」？";
  }
  return item.question;
}

function renderTap(item) {
  const prompt = item.promptPic
    ? '<div class="prompt-card">' + imgTag(W(item.promptPic).photo, W(item.promptPic).photoAlt, "photo prompt") +
      (item.type === "picToWord" || item.type === "picToJp" ? "" : wordBlock(item.promptPic)) + "</div>"
    : (item.promptWord
      ? '<div class="prompt-card">' + wordBlock(item.promptWord) + "</div>"
      : "");
  let feedback = "";
  if (state.locked) feedback = successCallout(item);
  else if (state.wrongTried.length) feedback = retryCallout();
  const options = item.options.map((opt) => {
    let cls = "choice";
    let pill = "";
    let disabled = false;
    if (state.locked && opt.id === item.answer) { cls += " correct"; pill = '<span class="pill ok">啱喇</span>'; }
    else if (state.wrongTried.indexOf(opt.id) >= 0) { cls += " wrong"; pill = '<span class="pill bad">再試一次</span>'; disabled = true; }
    if (state.locked) disabled = true;
    return '<div class="opt-wrap">' +
      '<button type="button" class="speak opt" data-speak-word="' + optionSpeak(opt) + '" aria-label="讀出選項">' + speakLabel("聽") + "</button>" +
      '<button type="button" class="' + cls + '" data-id="' + opt.id + '" ' + (disabled ? "disabled" : "") + ' aria-label="' + W(opt.id).word + '">' +
      pill + optionContent(opt) + "</button></div>";
  }).join("");
  return prompt + feedback + '<div class="options">' + options + "</div>";
}

function pickTap(id) {
  if (state.locked) return;
  const item = state.items[state.index];
  if (id === item.answer) {
    markFirst(true);
    state.locked = true;
    state.speakCue = "correct";
    render();
    return;
  }
  markFirst(false);
  if (state.wrongTried.indexOf(id) < 0) state.wrongTried.push(id);
  state.speakCue = "retry";
  render();
}

function showPiece(id, show, compact) {
  const w = W(id);
  if (show === "pic") return imgTag(w.photo, w.photoAlt, "photo cover");
  if (show === "sil") return imgTag(w.sil, w.word + "影子", "photo cover");
  if (show === "jp") return jpBlock(id);
  return wordBlock(id);
}

function neededTargets(item) {
  return item.targets.filter((id) => id !== "decoy");
}

function allPlaced(item) {
  return neededTargets(item).every((t) => {
    return Object.keys(state.placed).some((s) => state.placed[s] === t);
  });
}

function tryPlace(src, dst) {
  if (state.locked) return;
  const item = state.items[state.index];
  if (state.placed[src]) return;
  const occupied = Object.keys(state.placed).some((s) => state.placed[s] === dst);
  if (occupied) return;
  const ok = src === dst && src !== "decoy" && dst !== "decoy";
  if (ok) {
    state.placed[src] = dst;
    state.selectedDrag = null;
    state.flashDrop = null;
    if (allPlaced(item)) {
      markFirst(true);
      state.locked = true;
      state.speakCue = "correct";
    }
    render();
    return;
  }
  markFirst(false);
  state.flashDrop = dst;
  state.speakCue = "retry";
  render();
  setTimeout(() => {
    if (state.flashDrop === dst && !state.locked) {
      state.flashDrop = null;
      const node = document.querySelector('[data-drop="' + dst + '"]');
      if (node) node.classList.remove("flash-bad");
    }
  }, 900);
}

function bindBoard(item) {
  const root = document.getElementById("board");
  if (!root) return;
  const drags = [...root.querySelectorAll("[data-drag]")];
  let active = null;

  function selectSrc(el) {
    if (!el || el.classList.contains("placed")) {
      state.selectedDrag = null;
      drags.forEach((d) => d.classList.remove("selected"));
      return;
    }
    state.selectedDrag = el.getAttribute("data-drag");
    drags.forEach((d) => d.classList.toggle("selected", d === el));
  }

  drags.forEach((el) => {
    el.addEventListener("pointerdown", (ev) => {
      if (state.locked || el.classList.contains("placed")) return;
      ev.preventDefault();
      try { el.setPointerCapture(ev.pointerId); } catch (e) {}
      const r = el.getBoundingClientRect();
      active = {
        el, pid: ev.pointerId,
        ox: ev.clientX - r.left, oy: ev.clientY - r.top,
        sx: ev.clientX, sy: ev.clientY,
        dragging: false, w: r.width, h: r.height, left: r.left, top: r.top
      };
      selectSrc(el);
    });
    el.addEventListener("pointermove", (ev) => {
      if (!active || active.el !== el) return;
      const dx = ev.clientX - active.sx, dy = ev.clientY - active.sy;
      if (!active.dragging && (dx * dx + dy * dy) > 36) {
        active.dragging = true;
        el.classList.add("dragging");
        el.style.position = "fixed";
        el.style.zIndex = "40";
        el.style.width = active.w + "px";
        el.style.pointerEvents = "none";
      }
      if (active.dragging) {
        el.style.left = (ev.clientX - active.ox) + "px";
        el.style.top = (ev.clientY - active.oy) + "px";
      }
    });
    const end = (ev) => {
      if (!active || active.el !== el) return;
      const was = active.dragging;
      const x = ev.clientX, y = ev.clientY;
      el.classList.remove("dragging");
      el.style.position = "";
      el.style.zIndex = "";
      el.style.width = "";
      el.style.left = "";
      el.style.top = "";
      el.style.pointerEvents = "";
      try { el.releasePointerCapture(active.pid); } catch (e) {}
      active = null;
      if (was) {
        const hit = document.elementFromPoint(x, y);
        const drop = hit && hit.closest ? hit.closest("[data-drop]") : null;
        if (drop) tryPlace(el.getAttribute("data-drag"), drop.getAttribute("data-drop"));
      }
    };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  });

  root.querySelectorAll("[data-drop]").forEach((t) => {
    t.addEventListener("click", (ev) => {
      if (state.locked) return;
      const src = state.selectedDrag;
      if (!src) return;
      ev.preventDefault();
      tryPlace(src, t.getAttribute("data-drop"));
    });
  });
}

function renderDrag(item) {
  let feedback = "";
  if (state.locked) feedback = successCallout(item);
  else if (state.missedFirst || state.flashDrop) feedback = retryCallout();
  const srcCol = item.sources.map((id) => {
    const placed = !!state.placed[id];
    const sel = state.selectedDrag === id && !placed ? " selected" : "";
    if (placed) {
      return '<div class="drag placed" data-drag="' + id + '">' + showPiece(id, item.sourceShow) + "</div>";
    }
    return '<div class="drag' + sel + '" data-drag="' + id + '">' + showPiece(id, item.sourceShow) + "</div>";
  }).join("");
  const dstCol = item.targets.map((id) => {
    const filledBy = Object.keys(state.placed).find((s) => state.placed[s] === id);
    const flash = state.flashDrop === id ? " flash-bad" : "";
    if (filledBy) {
      return '<div class="drop filled" data-drop="' + id + '">' + showPiece(filledBy, item.sourceShow) + "</div>";
    }
    return '<div class="drop' + flash + '" data-drop="' + id + '">' + showPiece(id, item.targetShow) + "</div>";
  }).join("");
  const srcTitle = item.sourceShow === "word" ? "詞語" : (item.sourceShow === "sil" ? "影子" : "相片");
  const dstTitle = item.targetShow === "word" ? "詞語" : (item.targetShow === "sil" ? "影子" : "相片");
  return '<p class="hint">' + item.hint + "</p>" + feedback +
    '<div class="board" id="board">' +
    '<div><div class="col-title">' + srcTitle + '</div><div class="stack">' + srcCol + "</div></div>" +
    '<div><div class="col-title">' + dstTitle + '</div><div class="stack">' + dstCol + "</div></div>" +
    "</div>";
}

function renderMemory(item) {
  let feedback = "";
  if (state.locked) feedback = successCallout(item);
  else if (state.wrongTried.length && !state.lockFlip) feedback = retryCallout();
  else if (state.matched.length) {
    feedback = '<div class="callout success"><div class="lead">啱喇！</div>繼續搵下一對。</div>';
  }
  const n = item.cards.length;
  const gcls = n <= 4 ? "n4" : "n6";
  const cards = item.cards.map((c, i) => {
    const open = state.flipped.indexOf(i) >= 0 || state.matched.indexOf(c.pairId) >= 0;
    const matched = state.matched.indexOf(c.pairId) >= 0;
    let cls = "mem-card";
    if (open) cls += " open";
    if (matched) cls += " matched";
    if (state.lockFlip && state.flipped.indexOf(i) >= 0 && !matched) cls += " mismatch";
    let inner = '<div class="back-label">？</div>';
    if (open) {
      if (c.show === "pic") inner = imgTag(W(c.word).photo, W(c.word).photoAlt, "photo cover");
      else if (c.show === "jp") inner = jpBlock(c.word);
      else inner = wordBlock(c.word, "sm");
    }
    return '<button type="button" class="' + cls + '" data-card="' + i + '" aria-label="卡">' + inner + "</button>";
  }).join("");
  return feedback + '<div class="mem-grid ' + gcls + '" id="mem">' + cards + "</div>";
}

function flipCard(i) {
  if (state.locked || state.lockFlip) return;
  const item = state.items[state.index];
  const card = item.cards[i];
  if (state.matched.indexOf(card.pairId) >= 0) return;
  if (state.flipped.indexOf(i) >= 0) return;
  if (state.flipped.length >= 2) return;
  state.flipped.push(i);
  render();
  if (state.flipped.length < 2) return;
  const a = item.cards[state.flipped[0]];
  const b = item.cards[state.flipped[1]];
  if (a.pairId === b.pairId && a.cardId !== b.cardId) {
    state.matched.push(a.pairId);
    state.flipped = [];
    if (state.matched.length >= item.needed) {
      markFirst(true);
      state.locked = true;
      state.speakCue = "correct";
    } else {
      speakTexts(["啱喇"]);
    }
    render();
  } else {
    markFirst(false);
    state.lockFlip = true;
    state.wrongTried.push("mismatch");
    state.speakCue = "retry";
    render();
    setTimeout(() => {
      state.flipped = [];
      state.lockFlip = false;
      render();
    }, 1100);
  }
}

function renderPlay() {
  const item = state.items[state.index];
  if (!item) { goMenu(); return; }
  const meta = groupLabel() + "　" + modeTitle(state.mode) +
    "　第 " + (state.index + 1) + " 題，共 " + state.items.length + " 題";
  const nextLabel = state.group === "senior" ? "繼續" : "下一題";
  let body = "";
  if (item.kind === "tap") body = renderTap(item);
  else if (item.kind === "drag") body = renderDrag(item);
  else if (item.kind === "memory") body = renderMemory(item);

  document.getElementById("app").innerHTML =
    header(true, goMenu, meta) +
    '<div class="q-row"><h1>' + stemHtml(item) + "</h1>" +
    '<button type="button" class="speak" id="speak-q" aria-label="讀出題目同選項">' + speakLabel("聽題目") + "</button></div>" +
    body;

  if (item.kind === "tap") {
    document.querySelectorAll("button.choice[data-id]").forEach((b) => {
      b.onclick = () => pickTap(b.getAttribute("data-id"));
    });
  }
  if (item.kind === "drag") bindBoard(item);
  if (item.kind === "memory") {
    document.querySelectorAll("button[data-card]").forEach((b) => {
      b.onclick = () => flipCard(Number(b.getAttribute("data-card")));
    });
  }

  bindSpeakButtons(item);
  bindChrome(goMenu);
  const bar = document.getElementById("bar");
  bar.hidden = false;
  bar.innerHTML = state.locked
    ? '<button type="button" class="btn" id="bar-home">返回</button><button type="button" class="btn primary" id="bar-next">' + nextLabel + '</button><button type="button" class="btn fs" id="bar-fs">全螢幕</button>'
    : '<button type="button" class="btn" id="bar-home">返回</button><button type="button" class="btn fs" id="bar-fs">全螢幕</button>';
  document.getElementById("bar-home").onclick = goMenu;
  const nxt = document.getElementById("bar-next");
  if (nxt) nxt.onclick = goNext;
  document.getElementById("bar-fs").onclick = toggleFs;
  playCue(item);
}

function renderStart() {
  const bar = document.getElementById("bar");
  bar.hidden = true; bar.innerHTML = "";
  document.getElementById("app").innerHTML =
    '<div class="start-gate">' +
    "<h1>認識詞語「巴士、的士」</h1>" +
    '<div class="word-preview">' + imgTag("bus", "巴士", "photo cover") + imgTag("taxi", "的士", "photo cover") + "</div>" +
    '<button type="button" class="btn primary start-btn" id="btn-start">開始練習</button>' +
    '<p class="meta">用手指撳一下就可以開始</p>' +
    "</div>";
  document.getElementById("btn-start").onclick = () => {
    unlockSpeech();
    goHome();
  };
}

function render() {
  if (state.screen === "start") return renderStart();
  if (state.screen === "home") return renderHome();
  if (state.screen === "menu") return renderMenu();
  if (state.screen === "end") return renderEnd();
  return renderPlay();
}

function applyQa() {
  if (!QA_ON) { render(); return; }
  speakEnabled = false;
  const applyWrong = QA.indexOf("wrong") >= 0;
  const applyCorrect = QA.indexOf("correct") >= 0;
  if (QA.indexOf("senior") >= 0) state.group = "senior";
  else state.group = "junior";

  const modeMap = { tap: "tap", drag: "drag", shadow: "shadow", memory: "memory", jyutping: "jyutping" };
  let mode = null;
  Object.keys(modeMap).forEach((k) => { if (QA.indexOf(k) >= 0) mode = modeMap[k]; });

  if (QA === "home" || QA === "") { state.screen = "home"; render(); return; }
  if (QA.indexOf("menu") >= 0) { state.screen = "menu"; render(); return; }
  if (QA.indexOf("end") >= 0) {
    startMode(mode || "tap");
    state.finishedCount = 3;
    state.firstTryCorrect = 3;
    state.screen = "end";
    render();
    return;
  }
  startMode(mode || "tap");
  if (applyWrong || applyCorrect) {
    const item = state.items[0];
    if (item && item.kind === "tap") {
      if (applyWrong) {
        const wrong = item.options.find((o) => o.id !== item.answer);
        if (wrong) pickTap(wrong.id);
      } else if (applyCorrect) {
        pickTap(item.answer);
      }
    } else if (item && item.kind === "drag" && applyCorrect) {
      neededTargets(item).forEach((t) => { state.placed[t] = t; });
      state.locked = true;
      render();
    } else if (item && item.kind === "memory" && applyCorrect) {
      item.cards.forEach((c) => { if (state.matched.indexOf(c.pairId) < 0) state.matched.push(c.pairId); });
      state.locked = true;
      render();
    }
  }
}

applyQa();
})();
</script>
